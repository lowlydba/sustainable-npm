---
name: Lint
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  super-linter:
    name: Lint
    permissions:
      contents: read
      packages: read # Required for package listing
      pull-requests: write # To allow PR comments from tools that use the GITHUB_TOKEN
      statuses: write # To report GitHub Actions status checks
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          verify: "true"
          min_age: "7"

      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          persona: pedantic

  are-we-good:
    name: Rollup
    runs-on: ubuntu-latest
    needs: [super-linter]
    if: always()
    steps:
      - uses: lowlydba/are-we-good@4b62765391e357e78d0572113ab8b1c7d6b8d12a # v1.0.4
        with:
          jobs: ${{ toJSON(needs) }}
